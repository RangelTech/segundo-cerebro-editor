name: Release (Windows)
# Constroi so o Windows x86_64 (o app do Segundo Cerebro usa esse editor so no Windows por enquanto) e publica o instalador numa release.
# Uso: Actions > Release (Windows) > Run workflow, com a versao (ex.: v0.2.9-sc.1).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Versao da release (exemplo v0.2.9-sc.1)"
        required: true
permissions:
  contents: write
jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    secrets: inherit
  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artefatos
          merge-multiple: true
      - name: Renomear e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          cd artefatos
          ls -la
          for f in Concat-*-setup.exe; do mv "$f" "${f/Concat-/SegundoCerebroEditor-}"; done
          sha256sum SegundoCerebroEditor-*-setup.exe > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Segundo Cerebro Editor $TAG" --notes "Editor de video do Segundo Cerebro (baseado no Concat, AGPL-3.0). Codigo-fonte: este repositorio." SegundoCerebroEditor-*-setup.exe SHA256SUMS
